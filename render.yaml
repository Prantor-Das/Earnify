services:
  - type: web
    name: virlo-api
    runtime: node
    plan: free

    buildCommand: >
      pnpm install &&
      pnpm --filter @virlo/db db:generate &&
      pnpm build

    startCommand: pnpm --filter @virlo/api start

    envVars:
      - key: NODE_ENV
        value: production
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "1"
      - key: DATABASE_URL
        sync: false # Set to your Supabase Postgres pooler connection string
      - key: STELLAR_ADMIN_SECRET
        sync: false # Set manually in Render dashboard
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: STELLAR_NETWORK_PASSPHRASE
        value: Test SDF Network ; September 2015
      - key: SOROBAN_WASM_PATH
        value: contracts/virlo-campaign/artifacts/virlo_campaign.optimized.wasm
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false # Set to your deployed web origin, for example https://virlo.vercel.app
      - key: CORS_ORIGINS
        sync: false # Comma-separated allowed web origins
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false # https://<api-service>.onrender.com/api/auth/google/callback
