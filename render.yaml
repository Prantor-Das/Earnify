services:
  - type: web
    name: earnify-api
    runtime: node
    plan: free

    buildCommand: >
      pnpm install &&
      pnpm --filter @earnify/db db:generate &&
      pnpm build

    startCommand: pnpm --filter @earnify/api start

    envVars:
      - key: NODE_ENV
        value: production
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: earnify-db
          property: connectionString
      - key: STELLAR_ADMIN_SECRET
        sync: false # Set manually in Render dashboard
      - key: STELLAR_NETWORK
        value: testnet
      - key: SOROBAN_RPC_HOST
        value: https://soroban-testnet.stellar.org
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false # Set to your deployed web origin, for example https://earnify.vercel.app
      - key: CORS_ORIGINS
        sync: false # Comma-separated allowed web origins
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false # https://<api-service>.onrender.com/api/auth/google/callback

  - type: postgres
    name: earnify-db
    plan: free

    # Database auto-configured
    # Note: Use external Neon DB instead if you prefer managed postgres
    # Uncomment above and remove this section, then set DATABASE_URL manually
