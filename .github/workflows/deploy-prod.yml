name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PNPM_VERSION: 10.33.0

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint
        run: pnpm lint
      
      - name: Validate contracts
        run: node scripts/validate-contracts.js
  
  deploy-database:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: |
          pnpm --filter @earnify/db db:generate
          pnpm --filter @earnify/db db:deploy
  
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Vercel (Frontend)
        uses: vercel/action@master
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
          working-directory: apps/web
          production: true
  
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [test, deploy-database]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Trigger Render deployment (Backend)
        run: |
          curl --request POST \
            --url "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            --header 'content-type: application/json'
        if: secrets.RENDER_DEPLOY_HOOK != ''
      
      - name: Trigger Railway deployment (Alternative)
        run: |
          curl --request POST \
            --url "${{ secrets.RAILWAY_DEPLOY_HOOK }}" \
            --header 'content-type: application/json'
        if: secrets.RAILWAY_DEPLOY_HOOK != ''
  
  contract-deployment-notice:
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create deployment notice
        run: |
          echo "🚀 Deployment Complete!"
          echo ""
          echo "✅ Frontend deployed to Vercel"
          echo "✅ Backend deployed to Render/Railway"
          echo "✅ Database migrations applied"
          echo ""
          echo "📝 Manual Step Required:"
          echo "To deploy new Soroban contract, run:"
          echo "  export STELLAR_ADMIN_SECRET='your-secret'"
          echo "  export STELLAR_NETWORK='testnet' (or 'public')"
          echo "  ./scripts/deploy-contract.sh"
          echo ""
          echo "Or create a separate workflow for contract deployment."
